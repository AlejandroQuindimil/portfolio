<section id="personal-projects" class="py-5 bg-light">
  <div class="container proyectos-container">
    <h2 class="text-center mb-5"><span class="number">04. </span> Proyectos</h2>
    <div class="projects-section">
      <!-- Proyecto 1 -->
      <div class="col-12 mb-4">
        <div class="project-card">
          <div class="project-header-row">
            <h3>📊 Drip Marketplace</h3>
            <span class="badge-dev" *ngIf="isDripInDevelopment">🚧 En desarrollo</span>
          </div>
          <p class="text-muted">{{resumen_app1}}</p>
          <div class="carousel">
            <div class="carousel-images carousel1">
              <ng-container *ngFor="let item of media; let i = index">
                <img *ngIf="item.type === 'image'"
                    [src]="item.src"
                    [class.active]="i === currentIndex"
                    class="carousel-image"
                    (click)="openImage(item.src)">
                <video *ngIf="item.type === 'video'"
                    [src]="item.src"
                    [class.active]="i === currentIndex"
                    class="carousel-image"
                    controls>
                </video>
              </ng-container>
</div>
            <button (click)="prev()" class="carousel-control prev">❮</button>
            <button (click)="next()" class="carousel-control next">❯</button>
          </div>
          <div class="project-tags">
            <span class="badge bg-secondary">Angular</span>
            <span class="badge bg-secondary">Java</span>
            <span class="badge bg-secondary">Spring Boot</span>
            <span class="badge bg-secondary">MongoDB</span>
            <span class="badge bg-secondary">TypeScript</span>
            <span class="badge bg-secondary">HTML5</span>
            <span class="badge bg-secondary">CSS3</span>
          </div>
          <div class="mt-3">
            <a href="https://alejandroquindimil.github.io/marketplace/"
              class="fa fa-link"
              style=" font-size: 1.25rem;
              margin-left: 10px;">
            </a>
            <a href="https://github.com/AlejandroQuindimil/marketplace"
              class="btn btn-github" 
              style=" font-size: 1.25rem;
              margin-left: 10px;">
            <i class="fab fa-github me-1"></i> 
            </a>
          </div>
        </div>
      </div>
      <!-- Proyecto 2 -->
    </div>

    <app-image-modal></app-image-modal>
  </div>
</section>
